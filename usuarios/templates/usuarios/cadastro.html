{% extends 'solicitacoes/base.html' %}
{% block conteudo %}
<h1>Criar conta de cidadão</h1>
<p>Com uma conta, você pode reunir suas solicitações identificadas em uma página.</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Criar conta</button>
</form>
<p>Já tem conta? <a href="{% url 'solicitacoes:entrar' %}">Entrar</a>.</p>
<p>Para enviar anonimamente, acesse <a href="{% url 'solicitacoes:nova' %}">Nova solicitação</a>.</p>
{% endblock %}
