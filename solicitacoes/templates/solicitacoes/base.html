<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Prefeitura Resolve</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 30px auto;
      padding: 0 18px;
      line-height: 1.5;
    }
    nav {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-weight: bold;
    }
    input:not([type="checkbox"]), select, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
    }
    button {
      padding: 12px 20px;
      cursor: pointer;
    }
    .errorlist { color: #a40000; }
    code { overflow-wrap: anywhere; }
    img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'solicitacoes:nova' %}">
      Nova solicitação
    </a>
    <a href="{% url 'solicitacoes:consulta' %}">
      Acompanhar solicitação
    </a>
  </nav>

  {% block conteudo %}{% endblock %}
</body>
</html>
